# Include this file INSIDE the public server {} block, before generic regex locations.
# The example assumes: backend upstream fba_server:8001, and the existing upload
# directory is readable at /www/fba_server/backend/static/upload/ in this Nginx.
# Change the upstream and alias to your actual paths; do not create a new storage root.

client_max_body_size 1g;
client_body_timeout 1800s;

location ~ ^/updates/[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_-]*/latest\.yml$ {
    proxy_pass http://fba_server:8001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_cache off;
    add_header X-Content-Type-Options nosniff always;
}

# Only installers and blockmaps are public. Staging, JSON manifests and arbitrary
# files are never exposed by this mapping. Error responses must not be cached.
location ~ ^/updates/(?<update_app>[a-z0-9][a-z0-9_-]*)/(?<update_channel>[a-z0-9][a-z0-9_-]*)/(?<update_file>[A-Za-z0-9][A-Za-z0-9._-]*-[0-9]+\.[0-9]+\.[0-9]+-win-x64\.exe(?:\.blockmap)?)$ {
    alias /www/fba_server/backend/static/upload/app_updates/$update_app/$update_channel/$update_file;
    autoindex off;
    limit_except GET HEAD { deny all; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location /updates/ {
    return 404;
}

